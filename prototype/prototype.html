<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Насосолинго · Aquario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<style>
  :root{
    --ink:#0C3A4C; --ink-soft:#5C7C8A;
    --aqua:#10B0D6; --aqua-dark:#0B85A4;
    --spring:#38C173; --spring-dark:#28A05C;
    --coral:#F0603F; --coral-dark:#CE4327;
    --drop:#22A7E0;
    --brass:#E3A130;
    --bg:#E9F4F9; --card:#FFFFFF; --line:#DCEAF0;
    --lock:#B9CBD4;
    --soil1:#CBA574; --soil2:#B0894F; --soil3:#DAC488; --rock:#93A6B0;
    --water:#37A6DE;
    --shadow:0 8px 24px rgba(12,58,76,.14);
    --f-disp:'Fredoka','Nunito',system-ui,sans-serif;
    --f-body:'Nunito',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--f-body);
    background:
      radial-gradient(120% 80% at 50% -10%, #F4FBFE 0%, var(--bg) 55%, #DCEEF5 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:18px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- phone frame ---------- */
  .phone{
    width:100%;max-width:430px;
    height:min(860px,94vh);
    background:var(--card);
    border-radius:34px;
    box-shadow:var(--shadow), 0 0 0 8px #fff, 0 0 0 10px #CFE3EC;
    overflow:hidden;position:relative;
    display:flex;flex-direction:column;
  }
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- generic buttons ---------- */
  .btn{
    font-family:var(--f-body);font-weight:800;font-size:16px;letter-spacing:.02em;
    border:none;border-radius:16px;padding:15px 18px;width:100%;
    color:#fff;background:var(--aqua);
    box-shadow:0 5px 0 var(--aqua-dark);
    cursor:pointer;transition:transform .05s, box-shadow .05s, background .15s, opacity .15s;
    text-transform:uppercase;
  }
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--aqua-dark)}
  .btn.green{background:var(--spring);box-shadow:0 5px 0 var(--spring-dark)}
  .btn.coral{background:var(--coral);box-shadow:0 5px 0 var(--coral-dark)}
  .btn.ghost{background:#fff;color:var(--aqua);box-shadow:0 0 0 2px var(--line) inset;font-weight:800}
  .btn:disabled{background:#E4EDF1;color:#A9BEC8;box-shadow:0 5px 0 #D2E0E7;cursor:not-allowed}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

  /* ================= PATH SCREEN ================= */
  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;border-bottom:2px solid var(--line);background:#fff;z-index:3;
  }
  .stat{display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px}
  .stat .ico{width:24px;height:24px;display:grid;place-items:center}
  .stat.flow{color:var(--brass)} .stat.xp{color:var(--aqua)} .stat.life{color:var(--drop);margin-left:auto}
  .drops{display:flex;gap:2px}
  .drops svg{width:22px;height:22px}
  .drop-empty{opacity:.28;filter:grayscale(1)}

  .unit-banner{
    margin:16px 16px 8px;border-radius:18px;padding:14px 18px;color:#fff;
    background:linear-gradient(100deg,var(--aqua),#0C97BC);
    box-shadow:0 5px 0 var(--aqua-dark);
    display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;
  }
  .unit-banner .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.85}
  .unit-banner .uname{font-family:var(--f-disp);font-size:21px;font-weight:600}
  .unit-banner .wave{position:absolute;right:-10px;bottom:-18px;font-size:74px;opacity:.16}

  .well{flex:1;overflow-y:auto;position:relative;padding:6px 0 30px}
  .well-inner{position:relative;width:100%;min-height:640px}
  /* strata bands drawn as full-width layers behind the borehole */
  .strata{position:absolute;left:0;right:0;overflow:hidden}
  .strata .lbl{position:absolute;left:12px;font-size:10px;font-weight:800;letter-spacing:.1em;
    color:rgba(12,58,76,.5);text-transform:uppercase;top:6px}
  .depth{position:absolute;right:12px;font-size:11px;font-weight:800;color:var(--ink-soft)}
  /* the casing pipe down the middle */
  .casing{position:absolute;left:50%;top:0;bottom:0;width:96px;transform:translateX(-50%);
    background:linear-gradient(90deg, rgba(255,255,255,.5), rgba(255,255,255,.18) 50%, rgba(255,255,255,.5));
    border-left:3px solid rgba(255,255,255,.7);border-right:3px solid rgba(255,255,255,.7)}

  .nodes{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding-top:14px}
  .node-wrap{position:relative;margin:15px 0;display:flex;flex-direction:column;align-items:center}
  .node{
    width:74px;height:74px;border-radius:50%;
    display:grid;place-items:center;cursor:default;border:none;
    background:var(--lock);box-shadow:0 6px 0 rgba(0,0,0,.12);
    font-size:30px;position:relative;
  }
  .node.done{background:var(--spring);box-shadow:0 6px 0 var(--spring-dark);color:#fff}
  .node.current{background:var(--aqua);box-shadow:0 6px 0 var(--aqua-dark);color:#fff;cursor:pointer}
  .node.current::after{content:"";position:absolute;inset:-8px;border-radius:50%;
    border:4px solid var(--aqua);opacity:.5;animation:ring 1.6s ease-out infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.35);opacity:0}}
  .node.current:active{transform:translateY(4px);box-shadow:0 2px 0 var(--aqua-dark)}
  .node .cap{font-family:var(--f-disp);font-weight:700;font-size:13px;position:absolute;bottom:-24px;
    background:#fff;color:var(--aqua);padding:3px 12px;border-radius:20px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
  .node-title{margin-top:6px;font-size:12px;font-weight:800;color:var(--ink-soft);max-width:130px;text-align:center}
  .node.current + .node-title{color:var(--ink)}
  .off-l{transform:translateX(-46px)} .off-r{transform:translateX(46px)}

  .pump-marker{width:44px;height:70px;margin-top:20px;filter:drop-shadow(0 4px 6px rgba(12,58,76,.3))}

  /* ================= LESSON SCREEN ================= */
  .lesson-top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;z-index:3}
  .xclose{border:none;background:none;font-size:26px;color:#B7CAD3;cursor:pointer;line-height:1;padding:0 4px;font-weight:700}
  .xclose:hover{color:var(--coral)}
  .pbar{flex:1;height:16px;border-radius:10px;background:#E4EDF1;overflow:hidden;position:relative}
  .pfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:10px;
    background:linear-gradient(90deg,var(--aqua),#3FCBEE);transition:width .4s cubic-bezier(.4,1.2,.5,1)}
  .pfill::after{content:"";position:absolute;top:3px;left:8px;right:8px;height:4px;border-radius:4px;background:rgba(255,255,255,.45)}
  .life-mini{display:flex;align-items:center;gap:4px;font-weight:900;color:var(--drop);font-size:16px}
  .life-mini svg{width:24px;height:24px}

  .qbody{flex:1;overflow-y:auto;padding:8px 20px 150px;display:flex;flex-direction:column}
  .qkicker{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--aqua);margin:6px 0 4px}
  .qtext{font-family:var(--f-disp);font-weight:600;font-size:22px;line-height:1.25;margin:0 0 6px;color:var(--ink)}
  .scenario{background:#F2FAFD;border:2px solid #D5EBF4;border-radius:14px;padding:12px 14px;margin:10px 0 4px;
    font-size:14px;font-weight:600;color:var(--ink);line-height:1.5}
  .scenario b{color:var(--aqua-dark)}

  /* option cards */
  .opts{display:flex;flex-direction:column;gap:12px;margin-top:14px}
  .opt{
    display:flex;align-items:center;gap:12px;text-align:left;
    background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;
    padding:15px 16px;font-family:var(--f-body);font-weight:700;font-size:15px;color:var(--ink);
    cursor:pointer;transition:transform .05s,border-color .1s,background .1s;line-height:1.35;
  }
  .opt:active{transform:translateY(2px)}
  .opt .key{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);
    display:grid;place-items:center;font-weight:900;font-size:13px;color:var(--ink-soft)}
  .opt.sel{border-color:var(--aqua);background:#EDF9FD}
  .opt.sel .key{border-color:var(--aqua);color:var(--aqua);background:#fff}
  .opt.right{border-color:var(--spring);background:#EAF9F0}
  .opt.right .key{border-color:var(--spring);color:var(--spring);background:#fff}
  .opt.wrong{border-color:var(--coral);background:#FDEEEA}
  .opt.wrong .key{border-color:var(--coral);color:var(--coral);background:#fff}
  .opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .opt[disabled]{cursor:default}

  /* tap-error scene + slider well share the .scene */
  .scene{margin:12px auto 0;width:100%;max-width:320px}
  .scene svg{width:100%;height:auto;display:block}
  .hot{cursor:pointer}
  .hot .halo{opacity:0;transition:opacity .15s}
  .hot:hover .halo{opacity:.5}
  .hot.sel .halo{opacity:1}
  .tap-hint{text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:10px}

  .slider-status{margin:12px auto 0;max-width:320px;text-align:center;font-weight:800;font-size:15px;
    padding:10px 12px;border-radius:12px;transition:.15s}
  .slider-status.dry{background:#FDECE7;color:var(--coral-dark)}
  .slider-status.ok{background:#E7F8EF;color:var(--spring-dark)}
  .slider-status.sand{background:#FBF0DD;color:#9B6B18}
  .depth-slider{width:100%;max-width:320px;margin:16px auto 0;display:block;-webkit-appearance:none;
    height:22px;border-radius:12px;background:linear-gradient(90deg,#F0603F 0 34%,#38C173 34% 66%,#D8A24A 66% 100%);
    outline:none}
  .depth-slider::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;
    background:#fff;border:4px solid var(--aqua);box-shadow:0 3px 8px rgba(12,58,76,.35);cursor:grab}
  .depth-slider::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;
    border:4px solid var(--aqua);box-shadow:0 3px 8px rgba(12,58,76,.35);cursor:grab}
  .depth-slider:focus-visible{box-shadow:0 0 0 3px var(--ink)}
  .slider-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:8px;font-weight:700}

  /* matching */
  .match{display:flex;gap:14px;margin-top:16px}
  .mcol{flex:1;display:flex;flex-direction:column;gap:10px}
  .chip{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;
    padding:13px 12px;font-weight:700;font-size:13.5px;line-height:1.3;color:var(--ink);cursor:pointer;
    text-align:center;transition:transform .05s,border-color .1s,background .1s;min-height:64px;
    display:flex;align-items:center;justify-content:center}
  .chip:active{transform:translateY(2px)}
  .chip.sel{border-color:var(--aqua);background:#EDF9FD}
  .chip.done{border-color:var(--spring);background:#EAF9F0;color:var(--spring-dark);cursor:default;opacity:.9}
  .chip.miss{border-color:var(--coral);background:#FDEEEA;animation:shake .3s}
  .chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .match-hint{text-align:center;font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:14px}

  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}
    60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  .shake{animation:shake .35s}

  /* ---------- feedback footer ---------- */
  .footer{position:absolute;left:0;right:0;bottom:0;padding:16px 20px 20px;background:#fff;
    border-top:2px solid var(--line);z-index:5;transition:transform .3s cubic-bezier(.3,1.1,.5,1)}
  .feedback{transform:translateY(120%);transition:transform .32s cubic-bezier(.3,1.2,.5,1)}
  .feedback.show{transform:translateY(0)}
  .feedback.correct{background:#DFF6EA;border-top-color:#B7E7CC}
  .feedback.incorrect{background:#FCE7E1;border-top-color:#F5C6B8}
  .fb-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .fb-badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
    background:#fff;font-size:24px;font-weight:900}
  .correct .fb-badge{color:var(--spring)} .incorrect .fb-badge{color:var(--coral)}
  .fb-title{font-family:var(--f-disp);font-weight:600;font-size:19px}
  .correct .fb-title{color:var(--spring-dark)} .incorrect .fb-title{color:var(--coral-dark)}
  .fb-text{font-size:13.5px;font-weight:600;line-height:1.5;margin:0 0 12px;color:var(--ink)}
  .correct .fb-text{color:#1E6E44} .incorrect .fb-text{color:#8F3320}

  /* ---------- overlays: intro / result / gameover ---------- */
  .overlay{position:absolute;inset:0;background:linear-gradient(180deg,#F4FBFE,#DCEEF5);
    z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:30px 24px;text-align:center;animation:fade .3s}
  .ov-title{font-family:var(--f-disp);font-weight:700;font-size:27px;margin:14px 0 4px;color:var(--ink)}
  .ov-sub{font-size:15px;font-weight:600;color:var(--ink-soft);line-height:1.5;max-width:300px;margin-bottom:8px}
  .speech{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 18px;
    max-width:300px;font-weight:700;font-size:15px;line-height:1.45;color:var(--ink);position:relative;
    box-shadow:var(--shadow);margin-bottom:6px}
  .speech::after{content:"";position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
    border:11px solid transparent;border-top-color:#fff;border-bottom:0}
  .ov-actions{width:100%;max-width:300px;margin-top:26px;display:flex;flex-direction:column;gap:10px}

  .stats-row{display:flex;gap:12px;margin:20px 0 4px;width:100%;max-width:320px}
  .statcard{flex:1;border-radius:16px;padding:14px 8px;color:#fff;display:flex;flex-direction:column;gap:2px;
    box-shadow:0 5px 0 rgba(0,0,0,.12)}
  .statcard .n{font-family:var(--f-disp);font-weight:700;font-size:24px}
  .statcard .l{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
  .sc-xp{background:linear-gradient(135deg,var(--aqua),#0C97BC)}
  .sc-acc{background:linear-gradient(135deg,var(--brass),#CE8A1D)}
  .sc-flow{background:linear-gradient(135deg,var(--spring),#28A05C)}

  .mascot{width:150px;height:210px}
  .mascot.small{width:64px;height:90px;flex:none}
  @media (prefers-reduced-motion:no-preference){
    .bob{animation:bob 2.6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  }
  .confetti{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}

  .credit{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:#9DB6C1;font-weight:700;letter-spacing:.05em;z-index:1}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div id="screen"></div>
</div>

<!-- reusable drop + mascot SVG templates -->
<template id="tpl-drop">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12 2 4.5 11 4.5 15.5A7.5 7.5 0 0 0 19.5 15.5C19.5 11 12 2 12 2Z"
    fill="currentColor"/><path d="M9 13.5c-.6 1 .1 2.4 1.3 2.7" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity=".8"/></svg>
</template>

<script>
/* ============================================================
   НАСОСОЛИНГО — прототип. Юнит «Монтаж», урок «Установка насоса».
   Ванильный JS, одна страница. Маскот: субмерсибл Тритон (арт.3363).
   ============================================================ */

const DROP = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C12 2 4.5 11 4.5 15.5A7.5 7.5 0 0 0 19.5 15.5C19.5 11 12 2 12 2Z" fill="currentColor"/><path d="M9 13.4c-.55 1 .1 2.4 1.3 2.7" stroke="#fff" stroke-width="1.3" stroke-linecap="round" fill="none" opacity=".75"/></svg>`;

/* --- маскот-насос с настроениями: neutral | happy | worried | party --- */
function mascot(mood, cls){
  const eyes = {
    neutral:`<circle cx="34" cy="70" r="9" fill="#fff"/><circle cx="66" cy="70" r="9" fill="#fff"/>
             <circle cx="36" cy="71" r="4.2" fill="#0C3A4C"/><circle cx="68" cy="71" r="4.2" fill="#0C3A4C"/>`,
    happy:`<path d="M26 71q8-9 16 0" stroke="#0C3A4C" stroke-width="4.5" fill="none" stroke-linecap="round"/>
           <path d="M58 71q8-9 16 0" stroke="#0C3A4C" stroke-width="4.5" fill="none" stroke-linecap="round"/>`,
    worried:`<circle cx="34" cy="72" r="9" fill="#fff"/><circle cx="66" cy="72" r="9" fill="#fff"/>
             <circle cx="34" cy="74" r="4" fill="#0C3A4C"/><circle cx="66" cy="74" r="4" fill="#0C3A4C"/>
             <path d="M24 60l16 5M76 60l-16 5" stroke="#0C3A4C" stroke-width="3.5" stroke-linecap="round"/>`,
    party:`<path d="M26 72q8-10 16 0" stroke="#0C3A4C" stroke-width="4.5" fill="none" stroke-linecap="round"/>
           <path d="M58 72q8-10 16 0" stroke="#0C3A4C" stroke-width="4.5" fill="none" stroke-linecap="round"/>`
  }[mood];
  const mouth = {
    neutral:`<path d="M40 90q10 8 20 0" stroke="#0C3A4C" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    happy:`<path d="M38 88q12 16 24 0z" fill="#0C3A4C"/>`,
    worried:`<path d="M40 96q10 -8 20 0" stroke="#0C3A4C" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    party:`<path d="M36 87q14 20 28 0z" fill="#0C3A4C"/><path d="M40 92q10 6 20 0z" fill="#F0603F"/>`
  }[mood];
  const extra = {
    neutral:``, happy:``,
    worried:`<path d="M84 78q5 8 0 14" stroke="#22A7E0" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="84" cy="94" r="3.4" fill="#22A7E0"/>`,
    party:`<text x="16" y="34" font-size="18">✨</text><text x="78" y="30" font-size="16">💧</text>`
  }[mood];
  return `<svg class="mascot ${cls||''}" viewBox="0 0 100 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Насос Тритон, арт. 3363">
    <defs>
      <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#DCE7EC"/><stop offset=".28" stop-color="#F4F9FB"/>
        <stop offset=".55" stop-color="#C3D4DB"/><stop offset="1" stop-color="#E4EDF1"/>
      </linearGradient>
    </defs>
    <!-- cable -->
    <path d="M50 8 q-20 -4 -18 12" stroke="#0C3A4C" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- top cap -->
    <rect x="30" y="6" width="40" height="16" rx="7" fill="#10B0D6"/>
    <rect x="34" y="9" width="32" height="4" rx="2" fill="#fff" opacity=".5"/>
    <!-- body -->
    <rect x="26" y="20" width="48" height="96" rx="20" fill="url(#steel)" stroke="#B7CAD3" stroke-width="1.5"/>
    <!-- sticker 3363 -->
    <rect x="34" y="104" width="32" height="15" rx="4" fill="#0C3A4C"/>
    <text x="50" y="115" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="900" font-size="10" fill="#38C173">3363</text>
    <!-- intake bottom -->
    <path d="M32 116 h36 l-5 12 h-26 z" fill="#9FB4BD"/>
    <rect x="38" y="120" width="3" height="7" rx="1.5" fill="#0C3A4C" opacity=".5"/>
    <rect x="48" y="120" width="3" height="7" rx="1.5" fill="#0C3A4C" opacity=".5"/>
    <rect x="58" y="120" width="3" height="7" rx="1.5" fill="#0C3A4C" opacity=".5"/>
    <!-- face -->
    ${eyes}${mouth}${extra}
  </svg>`;
}

/* small pump used inside well scenes */
function pumpSVG(x,y,scale){
  scale=scale||1;
  return `<g transform="translate(${x} ${y}) scale(${scale})">
    <rect x="-13" y="-30" width="26" height="52" rx="10" fill="url(#steel2)" stroke="#8FA6B0" stroke-width="1.4"/>
    <rect x="-9" y="14" width="18" height="8" rx="3" fill="#0C3A4C"/>
    <text x="0" y="20.5" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="6" fill="#38C173">3363</text>

let CHECK = null; // function returning {correct, idx?} for current question
function enableCheck(on){ const b=document.getElementById('checkBtn'); if(b) b.disabled=!on; }

function showFeedback(res){

function renderMC(zone,q){
  let sel=null, locked=false;
  const keys=['А','Б','В','Г'];
  zone.innerHTML = `<div class="opts">${q.options.map((o,i)=>
    `<button class="opt" data-i="${i}"><span class="key">${keys[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
  const opts=[...zone.querySelectorAll('.opt')];
  opts.forEach(el=>el.addEventListener('click',()=>{
    if(locked) return;
    sel=+el.dataset.i;
    opts.forEach(o=>o.classList.toggle('sel', +o.dataset.i===sel));
    enableCheck(true);
  }));
  setCheck(()=>{
    locked=true;
    const correct = sel===q.answer;
    opts.forEach(o=>{
      o.setAttribute('disabled','');
      const i=+o.dataset.i;
      if(i===q.answer) o.classList.add('right');
      else if(i===sel) o.classList.add('wrong');
      o.classList.remove('sel');
    });
    return {correct, text: correct? q.ok : (q.err[sel]||'') };
  });
}

/* ---------- MATCH: symptom ↔ cause (self-completing) ---------- */
function renderMatch(zone,q){
  // shuffle right column
  const left=q.pairs.map((p,i)=>({txt:p.l,id:i}));
  const right=q.pairs.map((p,i)=>({txt:p.r,id:i})).sort(()=>Math.random()-0.5);
  zone.innerHTML=`
    <div class="match">
      <div class="mcol" id="colL">${left.map(o=>
        `<button class="chip" data-side="L" data-id="${o.id}">${o.txt}</button>`).join('')}</div>
      <div class="mcol" id="colR">${right.map(o=>
        `<button class="chip" data-side="R" data-id="${o.id}">${o.txt}</button>`).join('')}</div>
    </div>
    <div class="match-hint" id="mhint">Тапни симптом, потом причину</div>`;
  let selChip=null, doneCount=0;
  const chips=[...zone.querySelectorAll('.chip')];
  function clearSel(){ if(selChip){selChip.classList.remove('sel'); selChip=null;} }
  chips.forEach(ch=>ch.addEventListener('click',()=>{
    if(ch.classList.contains('done')) return;
    if(!selChip){ selChip=ch; ch.classList.add('sel'); return; }
    if(ch===selChip){ clearSel(); return; }
    if(ch.dataset.side===selChip.dataset.side){ // switch selection within same column
      clearSel(); selChip=ch; ch.classList.add('sel'); return;
    }
    // different columns → attempt match
    if(ch.dataset.id===selChip.dataset.id){
      ch.classList.add('done'); selChip.classList.add('done');
      clearSel(); doneCount++;
      if(doneCount===q.pairs.length){
        document.getElementById('mhint').textContent='Готово 👍';
        // auto-trigger correct feedback
        showFeedback({correct:true, text:q.ok});
      }
    } else {
      const a=ch, b=selChip; clearSel();
      [a,b].forEach(c=>{c.classList.add('miss'); setTimeout(()=>c.classList.remove('miss'),350);});
    }
  }));
  // matching needs no Проверить button
  const cb=document.getElementById('checkBtn');
  cb.style.display='none';
  setCheck(()=>({correct:true, text:q.ok}));
}

  S.done=true;
  const total = QUESTIONS.length;
  const acc = Math.round(S.correct/total*100);
  const xpGain = 15 + S.correct*4 + (S.wrong===0?10:0);
  S.xp = xpGain;
  app.innerHTML=`
  <div class="screen"><div class="overlay">
    ${confettiHTML()}
    ${mascot('party','bob')}
    <div class="ov-title">Урок пройден!</div>
    <div class="ov-sub">${S.wrong===0?'Ни одной ошибки — чистая работа, монтажник 💪':'Есть над чем поработать, но насос повешен правильно.'}</div>
    <div class="stats-row">
      <div class="statcard sc-xp"><span class="n">+${xpGain}</span><span class="l">Опыт</span></div>
      <div class="statcard sc-acc"><span class="n">${acc}%</span><span class="l">Точность</span></div>
      <div class="statcard sc-flow"><span class="n">🌊 13</span><span class="l">Поток</span></div>
    </div>
    <div class="ov-actions">
      <button class="btn green" onclick="renderPath()">Забрать награду</button>
      <button class="btn ghost" onclick="startLesson()">Пройти заново</button>
    </div>
  </div></div>`;
}

function confettiHTML(){
  const cols=['#10B0D6','#38C173','#E3A130','#F0603F','#22A7E0'];
  let out='';
  for(let i=0;i<28;i++){
    const l=Math.random()*100, d=1.6+Math.random()*1.6, delay=Math.random()*0.5;
    out+=`<span class="confetti" style="left:${l}%;background:${cols[i%cols.length]};
      animation-duration:${d}s;animation-delay:${delay}s"></span>`;
  }
  return out;
}

/* ===================== GAME OVER ===================== */
function renderGameOver(){
  app.innerHTML=`
  <div class="screen"><div class="overlay">
    ${mascot('worried','bob')}
    <div class="ov-title">Капли кончились</div>
    <div class="speech">Ничего — даже лучшие монтажники переделывают объект. Разберёмся и повесим правильно 💧</div>
    <div class="ov-actions">
      <button class="btn" onclick="startLesson()">Ещё раз</button>
      <button class="btn ghost" onclick="renderPath()">К карте</button>
    </div>
  </div></div>`;
}

/* ===================== BOOT ===================== */
renderPath();
</script>
</body>
</html>
